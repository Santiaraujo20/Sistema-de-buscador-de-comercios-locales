<VirtualHost *:80>
    # Establece la carpeta 'public' de Laravel como la carpeta raíz del servidor
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Permite que Laravel use archivos .htaccess (para enrutamiento)
        AllowOverride All
        Order allow,deny
        allow from all
    </Directory>

    # Configuración de logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
